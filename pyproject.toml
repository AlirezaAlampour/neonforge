[project]
name = "neonforge-dev"
version = "0.1.0a0"
description = "Development and test environment for the NeonForge control plane"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "redis[hiredis]==5.2.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests"]
addopts = "-ra"
