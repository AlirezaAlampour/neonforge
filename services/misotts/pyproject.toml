[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neonforge-misotts-service"
version = "0.1.0"
description = "Optional MisoTTS runtime for NeonForge"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bitsandbytes==0.45.5; sys_platform == 'linux' and platform_machine != 'aarch64'",
    "fastapi==0.115.6",
    "huggingface_hub==0.28.1",
    "moshi==0.2.2",
    "python-multipart==0.0.20",
    "safetensors==0.5.3",
    "sentencepiece==0.2",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher@d46d7d0893a583d8968ab3a6626e2289faec9152",
    "tokenizers==0.21.0",
    "torchao==0.9.0",
    "torchtune==0.4.0",
    "transformers==4.49.0",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
package = false
