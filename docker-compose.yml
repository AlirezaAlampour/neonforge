# =============================================================================
# DGX Spark AI Stack — Docker Compose v2
# Target: NVIDIA DGX Spark (GB10, 128 GB UMA, ARM64, CUDA 13.0)
# =============================================================================
# Usage:
#   cp .env.example .env   # edit values
#   docker compose up -d redis supervisor gateway whisper frontend  # always-on tier
#   docker compose up -d f5tts liveportrait lipsync                 # warm tier
#   # wan21 is started on-demand by the supervisor sidecar
# =============================================================================

name: dgx-ai-stack

x-common-gpu: &common-gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu, compute, utility]

x-common-env: &common-env
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  HF_HOME: /cache/hf
  TRANSFORMERS_CACHE: /cache/hf
  TORCH_HOME: /models/torch
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-common-volumes: &common-volumes
  - ${MODELS_DIR:-/srv/ai/models}:/models:rw
  - ${HF_CACHE_DIR:-/srv/ai/cache/hf}:/cache/hf:rw
  - ${OUTPUTS_DIR:-/srv/ai/outputs}:/outputs:rw
  - ${ASSETS_DIR:-/srv/ai/assets}:/app/data/assets:rw
  - ${LOGS_DIR:-/srv/ai/logs}:/logs:rw

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  # ===========================================================================
  # ALWAYS-ON TIER
  # ===========================================================================

  redis:
    image: redis:7.4-alpine
    container_name: ai-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults
      start_period: 5s
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 100
    networks:
      - ai-net

  # Supervisor sidecar — holds Docker socket, starts/stops lazy containers.
  # NOT exposed to external network. Only gateway calls it internally.
  supervisor:
    build:
      context: .
      dockerfile: supervisor/Dockerfile
    container_name: ai-supervisor
    restart: unless-stopped
    environment:
      <<: *common-env
      COMPOSE_DIR: /project
      WAN21_URL: http://wan21:8000
      F5TTS_URL: http://f5tts:8000
      LIVEPORTRAIT_URL: http://liveportrait:8000
      LIPSYNC_URL: http://lipsync:8000
      WHISPER_URL: http://whisper:8000
      FISH_SPEECH_URL: http://fish_speech:8000
      VOXCPM2_URL: http://voxcpm2:8000
      MISOTTS_URL: http://misotts:8000
      BREEZE_TTS_URL: http://breeze_tts:8000
      COMFYUI_URL: http://comfyui:8188
      IDLE_SCAN_INTERVAL: ${IDLE_SCAN_INTERVAL:-15}
      MEMORY_RECLAIM_TIMEOUT: ${MEMORY_RECLAIM_TIMEOUT:-90}
      F5TTS_IDLE_TIMEOUT: ${F5TTS_IDLE_TIMEOUT:-900}
      FISH_SPEECH_IDLE_TIMEOUT: ${FISH_SPEECH_IDLE_TIMEOUT:-900}
      VOXCPM2_IDLE_TIMEOUT: ${VOXCPM2_IDLE_TIMEOUT:-900}
      MISOTTS_IDLE_TIMEOUT: ${MISOTTS_IDLE_TIMEOUT:-900}
      BREEZE_TTS_IDLE_TIMEOUT: ${BREEZE_TTS_IDLE_TIMEOUT:-900}
      COMFYUI_IDLE_TIMEOUT: ${COMFYUI_IDLE_TIMEOUT:-300}
      LIVEPORTRAIT_IDLE_TIMEOUT: ${LIVEPORTRAIT_IDLE_TIMEOUT:-300}
      LIPSYNC_IDLE_TIMEOUT: ${LIPSYNC_IDLE_TIMEOUT:-300}
      WAN21_IDLE_TIMEOUT: ${WAN21_IDLE_TIMEOUT:-300}
      WAN_UI_IDLE_TIMEOUT: ${WAN_UI_IDLE_TIMEOUT:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/project:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 10s
    networks:
      - ai-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8000"
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/0
      SUPERVISOR_URL: http://supervisor:8000
      WHISPER_URL: http://whisper:8000
      F5TTS_URL: http://f5tts:8000
      FISH_SPEECH_ENABLED: ${FISH_SPEECH_ENABLED:-false}
      FISH_SPEECH_INTERNAL_URL: ${FISH_SPEECH_INTERNAL_URL:-http://fish_speech:8000}
      LIVEPORTRAIT_URL: http://liveportrait:8000
      LIPSYNC_URL: http://lipsync:8000
      MISOTTS_BASE_URL: ${MISOTTS_BASE_URL:-http://misotts:8000}
      MISOTTS_INTERNAL_URL: ${MISOTTS_INTERNAL_URL:-http://misotts:8000}
      BREEZE_TTS_ENABLED: ${BREEZE_TTS_ENABLED:-false}
      BREEZE_TTS_INTERNAL_URL: ${BREEZE_TTS_INTERNAL_URL:-http://breeze_tts:8000}
      VOXCPM2_ENABLED: ${VOXCPM2_ENABLED:-false}
      VOXCPM2_INTERNAL_URL: ${VOXCPM2_INTERNAL_URL:-http://voxcpm2:8000}
      WAN21_URL: http://wan21:8000
      COMFYUI_URL: http://comfyui:8188
      COMFYUI_MODEL_ROOTS: ${COMFYUI_MODEL_ROOTS:-/models/comfyui,/opt/ComfyUI/custom_nodes/comfyui_controlnet_aux/ckpts}
      MEMORY_WARN_THRESHOLD: ${MEMORY_WARN_THRESHOLD:-70}
      MEMORY_HARD_LIMIT: ${MEMORY_HARD_LIMIT:-80}
      MEM_RESERVE_HEAVY_GB: ${MEM_RESERVE_HEAVY_GB:-40}
      MEM_RESERVE_MEDIUM_GB: ${MEM_RESERVE_MEDIUM_GB:-10}
      MEM_RESERVE_LIGHT_GB: ${MEM_RESERVE_LIGHT_GB:-2}
    volumes:
      - ${MODELS_DIR:-/srv/ai/models}:/models:ro
      - ${OUTPUTS_DIR:-/srv/ai/outputs}:/outputs:rw
      - ${ASSETS_DIR:-/srv/ai/assets}:/app/data/assets:rw
      - ${LOGS_DIR:-/srv/ai/logs}:/logs:rw
      # NOTE: No docker.sock — orchestration delegated to supervisor
    depends_on:
      redis:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 10s
    networks:
      - ai-net

  # Director's Console — NeonForge web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      <<: *healthcheck-defaults
      start_period: 30s
    networks:
      - ai-net

  whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    container_name: ai-whisper
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 120s
    networks:
      - ai-net

  # ===========================================================================
  # WARM TIER — containers run, models load on first request, destroyed on idle
  # ===========================================================================

  f5tts:
    build:
      context: ./services/f5tts
      dockerfile: Dockerfile
    container_name: ai-f5tts
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
      F5TTS_IDLE_TIMEOUT: ${F5TTS_IDLE_TIMEOUT:-1800}
      F5TTS_SAMPLE_RATE: ${F5TTS_SAMPLE_RATE:-24000}
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 120s
    networks:
      - ai-net

  fish_speech:
    image: dgx-ai-stack-fish_speech
    container_name: ai-fish-speech
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
    volumes: *common-volumes
    profiles:
      - voice-extras
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      <<: *healthcheck-defaults
      start_period: 180s
    networks:
      - ai-net

  voxcpm2:
    build:
      context: ./services/voxcpm2
      dockerfile: Dockerfile
    container_name: ai-voxcpm2
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
      VOXCPM2_MODEL_PATH: ${VOXCPM2_MODEL_PATH:-/models/voxcpm2/openbmb/VoxCPM2}
    volumes: *common-volumes
    profiles:
      - voice-extras
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 180s
    networks:
      - ai-net

  misotts:
    build:
      context: ./services/misotts
      dockerfile: Dockerfile
    container_name: ai-misotts
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
      TTS_PROVIDER: ${TTS_PROVIDER:-misotts}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}
      NO_TORCH_COMPILE: ${NO_TORCH_COMPILE:-1}
      MISOTTS_MODEL_ID: ${MISOTTS_MODEL_ID:-MisoLabs/MisoTTS}
      MISOTTS_DEVICE: ${MISOTTS_DEVICE:-auto}
      MISOTTS_MAX_AUDIO_MS: ${MISOTTS_MAX_AUDIO_MS:-10000}
      MISOTTS_ENABLE_VOICE_PROMPT: ${MISOTTS_ENABLE_VOICE_PROMPT:-true}
      MISOTTS_ENABLE_WATERMARK: ${MISOTTS_ENABLE_WATERMARK:-true}
      MISOTTS_CHECKOUT_DIR: ${MISOTTS_CHECKOUT_DIR:-/opt/misotts-src}
      MISOTTS_MIN_CUDA_FREE_GB: ${MISOTTS_MIN_CUDA_FREE_GB:-12}
    volumes: *common-volumes
    profiles:
      - voice-extras
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 180s
    networks:
      - ai-net

  breeze_tts:
    build:
      context: ./services/breeze_tts
      dockerfile: Dockerfile
      args:
        BREEZE_TTS_SOURCE_REV: ${BREEZE_TTS_SOURCE_REV:-008f769016b0a24711becd7a4925030bc93f608c}
    container_name: ai-breeze-tts
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}
      BREEZE_TTS_SERVICE_ENABLED: "true"
      BREEZE_TTS_MODEL_ID: ${BREEZE_TTS_MODEL_ID:-BreezeBlue/Breeze-TTS-2}
      BREEZE_TTS_MODEL_PATH: ${BREEZE_TTS_MODEL_PATH:-/models/breeze_tts/Breeze-TTS-2}
      BREEZE_TTS_AUTO_DOWNLOAD: ${BREEZE_TTS_AUTO_DOWNLOAD:-true}
      BREEZE_TTS_SOURCE_DIR: /opt/breeze-tts-src
    volumes: *common-volumes
    profiles:
      - breeze
      - full
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-net

  comfyui:
    build:
      context: .
      dockerfile: comfyUI/Dockerfile
    container_name: ai-comfyui
    # The supervisor owns recovery. A model-process OOM must remain visible to
    # the active job instead of silently restarting with a lost prompt.
    restart: "no"
    <<: *common-gpu
    environment:
      <<: *common-env
      COMFYUI_PORT: ${COMFYUI_PORT:-8188}
      AUX_ANNOTATOR_CKPTS_PATH: /opt/ComfyUI/custom_nodes/comfyui_controlnet_aux/ckpts
    volumes:
      - ${MODELS_DIR:-/srv/ai/models}:/models:rw
      - ${HF_CACHE_DIR:-/srv/ai/cache/hf}:/cache/hf:rw
      - ${OUTPUTS_DIR:-/srv/ai/outputs}:/outputs:rw
      - ${ASSETS_DIR:-/srv/ai/assets}:/app/data/assets:rw
      - ${LOGS_DIR:-/srv/ai/logs}:/logs:rw
      - ${MODELS_DIR:-/srv/ai/models}/comfyui/controlnet_aux:/opt/ComfyUI/custom_nodes/comfyui_controlnet_aux/ckpts:rw
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"
    command: >
      python main.py
      --listen 0.0.0.0
      --port 8188
      --input-directory /outputs/comfyui/input
      --output-directory /outputs/comfyui/output
      --user-directory /outputs/comfyui/user
      --enable-manager
    profiles:
      - comfyui
      - full
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/')"]
      <<: *healthcheck-defaults
      start_period: 120s
    networks:
      - ai-net

  liveportrait:
    build:
      context: ./services/liveportrait
      dockerfile: Dockerfile
    container_name: ai-liveportrait
    restart: unless-stopped
    <<: *common-gpu
    environment:
      <<: *common-env
      LIVEPORTRAIT_IDLE_TIMEOUT: ${LIVEPORTRAIT_IDLE_TIMEOUT:-1800}
      LIVEPORTRAIT_SOURCE_DIR: ${LIVEPORTRAIT_SOURCE_DIR:-/opt/LivePortrait}
    volumes: *common-volumes
    profiles:
      - legacy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 120s
    networks:
      - ai-net

  wan-ui:
    build:
      context: ./Wan2.2-Animate
      dockerfile: Dockerfile
      additional_contexts:
        comfyui_resolver: ./comfyUI
    container_name: ai-wan-ui
    restart: unless-stopped
    <<: *common-gpu
    volumes:
      - /srv/ai/models/comfyui:/models/comfyui:ro
      - ${HF_CACHE_DIR:-/srv/ai/cache/hf}:/cache/hf:rw
    environment:
      HF_HOME: /cache/hf
      GRADIO_SERVER_NAME: "0.0.0.0"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:7860:7860"
    profiles:
      - cloud-experimental
    networks:
      - ai-net

  lipsync:
    build:
      context: ./services/lipsync
      dockerfile: Dockerfile
    container_name: ai-lipsync
    restart: "no"
    <<: *common-gpu
    environment:
      <<: *common-env
      LATENTSYNC_SOURCE_DIR: /opt/LatentSync
      LATENTSYNC_CHECKPOINT_DIR: /models/latentsync/checkpoints
      LATENTSYNC_TIMEOUT_SEC: ${LATENTSYNC_TIMEOUT_SEC:-1800}
    volumes: *common-volumes
    profiles:
      - lipsync
      - full
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 120s
    networks:
      - ai-net

  # ===========================================================================
  # LAZY-START TIER — started on demand by supervisor, stopped after idle
  # ===========================================================================

  wan21:
    build:
      context: ./services/wan21
      dockerfile: Dockerfile
    container_name: ai-wan21
    # No restart — managed by supervisor + idle_manager
    restart: "no"
    <<: *common-gpu
    environment:
      <<: *common-env
      WAN21_MODEL_VARIANT: ${WAN21_MODEL_VARIANT:-1.3B}
      WAN21_MAX_CONCURRENT: ${WAN21_MAX_CONCURRENT:-1}
      WAN21_IDLE_TIMEOUT: ${WAN21_IDLE_TIMEOUT:-300}
      WAN21_MAX_VIDEO_LENGTH: ${WAN21_MAX_VIDEO_LENGTH:-10}
      WAN21_MAX_RESOLUTION: ${WAN21_MAX_RESOLUTION:-512}
    volumes: *common-volumes
    profiles:
      - wan21
      - full
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      <<: *healthcheck-defaults
      start_period: 180s
    networks:
      - ai-net

volumes:
  redis-data:
    driver: local

networks:
  ai-net:
    driver: bridge
    name: ai-net
